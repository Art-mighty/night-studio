<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Studio</title>
  <meta name="description" content="A cozy 30-evening studio for learning merch design with Figma.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module">
    import { start } from "./js/main.js";
    import { COURSE } from "./js/content/course.js";
    start(COURSE);
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">🪔 Night Studio</a>
    <nav class="stats" aria-label="Your studio">
      <span id="stat-name"></span>
      <span id="stat-xp" title="XP"></span>
      <span id="stat-lanterns" title="Lanterns lit"></span>
      <a href="#/shelf">Shelf</a>
      <button id="mute" type="button" aria-label="Sounds on or off">🔔</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <aside id="lumi" aria-label="Lumi, your studio buddy">
    <canvas></canvas>
    <div class="lumi-bubble" role="status" aria-live="polite"></div>
    <button class="lumi-tap" type="button" aria-label="Tap Lumi"></button>
  </aside>

  <footer class="foot"><a href="#/grown-ups">For grown-ups</a></footer>

  <noscript><p class="file-warning">Night Studio needs JavaScript turned on.</p></noscript>
  <script>
    // Opened by double-clicking the file? The game has to come from a web address (YouTube and the game's own
    // scripts refuse to run from a plain file). See README.md.
    if (location.protocol === "file:") {
      document.getElementById("app").innerHTML =
        '<p class="file-warning">Open Night Studio from its web address, not as a file. ' +
        'To try it on this computer, run <code>python3 serve.py</code> in this folder and visit ' +
        '<a href="http://localhost:8000">http://localhost:8000</a>.</p>';
    }
  </script>
</body>
</html>
